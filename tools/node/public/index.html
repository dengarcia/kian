<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kian</title>
<style>
:root {
  --bg:      #f8f9fa;
  --surface: #ffffff;
  --border:  #e5e7eb;
  --text:    #111827;
  --muted:   #6b7280;
  --faint:   #9ca3af;

  --todo:                #6b7280;
  --in_progress:         #3b82f6;
  --needs_clarification: #f59e0b;
  --review:              #8b5cf6;
  --blocked:             #ef4444;
  --done:                #10b981;
  --cancelled:           #9ca3af;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo { font-weight: 700; font-size: 16px; letter-spacing: -0.3px; }
.logo em { font-style: normal; color: #3b82f6; }

nav { display: flex; gap: 2px; }

nav button {
  background: none;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}
nav button.active { background: #eff6ff; color: #3b82f6; }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }

.summary { display: flex; gap: 14px; }
.summary-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; }

.btn { background: none; border: 1px solid var(--border); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted); }
.btn:hover { background: var(--bg); }

/* ── Filters ── */
.filters {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.pill {
  padding: 4px 11px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}
.pill:hover { background: var(--bg); }
.pill.active { border-color: currentColor; }
.pill[data-s="all"].active    { color: var(--text);               border-color: #d1d5db; background: #f9fafb; }
.pill[data-s="todo"].active                { color: var(--todo); }
.pill[data-s="in_progress"].active         { color: var(--in_progress); }
.pill[data-s="needs_clarification"].active { color: var(--needs_clarification); }
.pill[data-s="review"].active              { color: var(--review); }
.pill[data-s="blocked"].active             { color: var(--blocked); }
.pill[data-s="done"].active                { color: var(--done); }

select.pill { padding-right: 8px; margin-left: auto; background: white; }

/* ── Content ── */
main { max-width: 820px; margin: 0 auto; padding: 20px 24px; }

.empty { text-align: center; color: var(--muted); padding: 48px 0; }

/* ── Task list ── */
.task-list { display: flex; flex-direction: column; gap: 6px; }

/* ── Task card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.card-header {
  padding: 11px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.card-header:hover { background: #fafafa; }

/* Status badge */
.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  white-space: nowrap;
  flex-shrink: 0;
}
.s-todo                { background: #f3f4f6; color: var(--todo); }
.s-in_progress         { background: #eff6ff; color: var(--in_progress); }
.s-needs_clarification { background: #fffbeb; color: var(--needs_clarification); }
.s-review              { background: #f5f3ff; color: var(--review); }
.s-blocked             { background: #fef2f2; color: var(--blocked); }
.s-done                { background: #ecfdf5; color: var(--done); }
.s-cancelled           { background: #f9fafb; color: var(--cancelled); }

.card-title { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.avatars { display: flex; }
.avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #e5e7eb;
  color: var(--muted);
  font-size: 10px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid white;
  margin-left: -4px;
}
.avatar:first-child { margin-left: 0; }
.avatar.agent { background: #eff6ff; color: #3b82f6; }

.pri { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.p-high   { background: #ef4444; }
.p-medium { background: #f59e0b; }
.p-low    { background: #10b981; }

.tag { font-size: 11px; color: var(--muted); background: #f3f4f6; padding: 1px 7px; border-radius: 4px; white-space: nowrap; }

.chevron { font-size: 11px; color: var(--faint); transition: transform .15s; flex-shrink: 0; }
.card.open .chevron { transform: rotate(180deg); }

/* ── Task detail ── */
.detail { display: none; border-top: 1px solid var(--border); padding: 16px; }
.card.open .detail { display: block; }

.section + .section { margin-top: 14px; }
.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }
.section-body { font-size: 13px; color: var(--text); line-height: 1.6; }
.section-body.notes { color: var(--muted); font-style: italic; }

/* ── Comments ── */
.comments { display: flex; flex-direction: column; gap: 10px; }

.comment { display: flex; gap: 10px; }

.av28 {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: #e5e7eb;
  color: var(--muted);
  font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.av28.agent { background: #eff6ff; color: #3b82f6; }

.comment-right { flex: 1; }
.comment-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.comment-author { font-weight: 600; font-size: 12px; }
.comment-time { font-size: 11px; color: var(--faint); }
.comment-body { font-size: 13px; line-height: 1.5; }

/* ── Activity ── */
.feed { display: flex; flex-direction: column; gap: 6px; }

.activity {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  gap: 12px;
}

.activity-right { flex: 1; min-width: 0; }
.activity-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.act-author { font-weight: 600; font-size: 12px; }
.act-on { font-size: 12px; color: var(--muted); }
.act-task { font-size: 12px; color: #3b82f6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.act-time { font-size: 11px; color: var(--faint); margin-left: auto; }
.activity-body { font-size: 13px; color: var(--muted); line-height: 1.5; }

/* ── Reply form ── */
.reply-form { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }

.reply-author {
  width: fit-content;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  background: white;
  color: var(--text);
}

.reply-textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  resize: vertical;
  color: var(--text);
  line-height: 1.5;
}
.reply-textarea:focus { outline: none; border-color: #3b82f6; }

.reply-actions { display: flex; justify-content: flex-end; }

.reply-submit {
  background: #3b82f6;
  color: white;
  border: none;
  padding: 6px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.reply-submit:hover { background: #2563eb; }
.reply-submit:disabled { opacity: 0.5; cursor: default; }

/* ── Card actions (edit / delete) ── */
.card-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .1s; }
.card-header:hover .card-actions { opacity: 1; }

.card-action {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 7px;
  font-size: 11px;
  cursor: pointer;
  color: var(--muted);
  white-space: nowrap;
}
.card-action:hover { background: var(--bg); }
.card-action.danger:hover { background: #fef2f2; color: var(--blocked); border-color: #fecaca; }

/* ── Modal ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}

.modal {
  background: var(--surface);
  border-radius: 10px;
  width: 520px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.modal-header {
  padding: 18px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.modal-title { font-weight: 600; font-size: 15px; }
.modal-close { background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 4px; }
.modal-close:hover { background: var(--bg); }

.modal-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  background: white;
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: #3b82f6; }
.field textarea { resize: vertical; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.checkboxes { display: flex; flex-direction: column; gap: 6px; }
.checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.checkbox-item input { width: 14px; height: 14px; cursor: pointer; }

.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.btn-cancel { background: none; border: 1px solid var(--border); padding: 7px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--text); }
.btn-cancel:hover { background: var(--bg); }
.btn-save { background: #3b82f6; color: white; border: none; padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-save:hover { background: #2563eb; }
.btn-save:disabled { opacity: .5; cursor: default; }

/* New Task button */
.btn-new { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-new:hover { background: #2563eb; }
</style>
</head>
<body>

<header>
  <div class="logo">Kian <em>AI</em></div>
  <nav>
    <button class="active" onclick="showTab('tasks')">Tasks</button>
    <button onclick="showTab('activity')">Activity</button>
  </nav>
  <div class="header-right">
    <div class="summary" id="summary"></div>
    <button class="btn" onclick="refresh()">Refresh</button>
    <button class="btn-new" onclick="openModal()">New Task</button>
  </div>
</header>

<!-- Task modal (add / edit) -->
<div class="overlay" id="modal-overlay" hidden onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">New Task</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Title *</label>
        <input id="f-title" type="text" placeholder="Task title">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="f-description" rows="3" placeholder="More context for the task…"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Priority</label>
          <select id="f-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field" id="f-status-wrap">
          <label>Status</label>
          <select id="f-status">
            <option value="todo">Todo</option>
            <option value="in_progress">In Progress</option>
            <option value="needs_clarification">Needs Input</option>
            <option value="review">Review</option>
            <option value="blocked">Blocked</option>
            <option value="done">Done</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Project</label>
        <select id="f-project"><option value="">No project</option></select>
      </div>
      <div class="field">
        <label>Assignees</label>
        <div class="checkboxes" id="f-assignees"></div>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f-notes" rows="2" placeholder="Short summary note visible in list view…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="modal-save" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<div id="tab-tasks">
  <div class="filters">
    <button class="pill active" data-s="all"                onclick="setStatus('all')">All</button>
    <button class="pill"        data-s="todo"               onclick="setStatus('todo')">Todo</button>
    <button class="pill"        data-s="in_progress"        onclick="setStatus('in_progress')">In Progress</button>
    <button class="pill"        data-s="needs_clarification" onclick="setStatus('needs_clarification')">Needs Input</button>
    <button class="pill"        data-s="review"             onclick="setStatus('review')">Review</button>
    <button class="pill"        data-s="blocked"            onclick="setStatus('blocked')">Blocked</button>
    <button class="pill"        data-s="done"               onclick="setStatus('done')">Done</button>
    <select class="pill" id="assignee-select" onchange="setAssignee(this.value)">
      <option value="">All assignees</option>
    </select>
  </div>
  <main>
    <div class="task-list" id="task-list"><div class="empty">Loading…</div></div>
  </main>
</div>

<div id="tab-activity" hidden>
  <main>
    <div class="feed" id="activity-feed"><div class="empty">Loading…</div></div>
  </main>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let tab = 'tasks', statusFilter = 'all', assigneeFilter = '', openCardId = null;
let users = [], projects = [], editingTaskId = null;

const STATUS_LABELS = {
  todo: 'Todo', in_progress: 'In Progress', needs_clarification: 'Needs Input',
  review: 'Review', blocked: 'Blocked', done: 'Done', cancelled: 'Cancelled',
};

// ── Boot ──────────────────────────────────────────────────────────────────────
async function init() {
  [users, projects] = await Promise.all([api('/api/users'), api('/api/projects')]);

  // Populate assignee filter dropdown
  const sel = document.getElementById('assignee-select');
  users.forEach(u => {
    const o = document.createElement('option');
    o.value = u.id;
    o.textContent = u.name + (u.type === 'agent' ? ' (agent)' : '');
    sel.appendChild(o);
  });

  // Populate modal project dropdown
  const projSel = document.getElementById('f-project');
  projects.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name;
    projSel.appendChild(o);
  });

  // Populate modal assignee checkboxes
  const assigneeBox = document.getElementById('f-assignees');
  assigneeBox.innerHTML = users.map(u => `
    <label class="checkbox-item">
      <input type="checkbox" name="assignee" value="${u.id}">
      ${esc(u.name)}${u.type === 'agent' ? ' <span style="color:var(--in_progress);font-size:11px">(agent)</span>' : ''}
    </label>`).join('');

  await Promise.all([loadTasks(), loadSummary()]);
}

async function api(url) {
  const r = await fetch(url);
  return r.json();
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(t) {
  tab = t;
  document.getElementById('tab-tasks').hidden    = (t !== 'tasks');
  document.getElementById('tab-activity').hidden = (t !== 'activity');
  document.querySelectorAll('nav button').forEach((b, i) => b.classList.toggle('active', i === (t === 'tasks' ? 0 : 1)));
  if (t === 'activity') loadActivity();
}

// ── Summary ───────────────────────────────────────────────────────────────────
async function loadSummary() {
  const tasks = await api('/api/tasks');
  const counts = {};
  tasks.forEach(t => { counts[t.status] = (counts[t.status] || 0) + 1; });

  const items = [
    { s: 'in_progress',         label: 'in progress', color: 'var(--in_progress)' },
    { s: 'needs_clarification', label: 'need input',  color: 'var(--needs_clarification)' },
    { s: 'review',              label: 'in review',   color: 'var(--review)' },
    { s: 'todo',                label: 'todo',        color: 'var(--todo)' },
  ].filter(i => counts[i.s]);

  document.getElementById('summary').innerHTML = items.map(i =>
    `<span class="summary-item"><span class="dot" style="background:${i.color}"></span>${counts[i.s]} ${i.label}</span>`
  ).join('');
}

// ── Tasks ─────────────────────────────────────────────────────────────────────
function setStatus(s) {
  statusFilter = s;
  document.querySelectorAll('.pill[data-s]').forEach(p => p.classList.toggle('active', p.dataset.s === s));
  loadTasks();
}

function setAssignee(v) { assigneeFilter = v; loadTasks(); }

async function loadTasks() {
  const p = new URLSearchParams();
  if (statusFilter !== 'all') p.set('status', statusFilter);
  if (assigneeFilter) p.set('assignee', assigneeFilter);
  const tasks = await api(`/api/tasks?${p}`);
  renderTasks(tasks);
}

function renderTasks(tasks) {
  const el = document.getElementById('task-list');
  if (!tasks.length) { el.innerHTML = '<div class="empty">No tasks found.</div>'; return; }
  el.innerHTML = tasks.map(taskCard).join('');
}

function taskCard(t) {
  const avatars = (t.assignees || []).map(u =>
    `<div class="avatar${u.type === 'agent' ? ' agent' : ''}" title="${esc(u.name)}">${u.name[0].toUpperCase()}</div>`
  ).join('');
  return `
<div class="card" id="c-${t.id}">
  <div class="card-header" onclick="toggle('${t.id}')">
    <span class="badge s-${t.status}">${STATUS_LABELS[t.status] || t.status}</span>
    <span class="card-title">${esc(t.title)}</span>
    <div class="card-meta">
      ${t.project_name ? `<span class="tag">${esc(t.project_name)}</span>` : ''}
      <span class="pri p-${t.priority}" title="${t.priority}"></span>
      <div class="avatars">${avatars}</div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="card-action" onclick="editTask('${t.id}')">Edit</button>
        <button class="card-action danger" onclick="deleteTask('${t.id}')">Delete</button>
      </div>
      <span class="chevron">▾</span>
    </div>
  </div>
  <div class="detail" id="d-${t.id}"><div class="empty" style="padding:8px 0">Loading…</div></div>
</div>`;
}

async function toggle(id) {
  const card = document.getElementById(`c-${id}`);
  if (card.classList.contains('open')) { card.classList.remove('open'); openCardId = null; return; }
  if (openCardId) document.getElementById(`c-${openCardId}`)?.classList.remove('open');
  card.classList.add('open');
  openCardId = id;
  const t = await api(`/api/tasks/${id}`);
  document.getElementById(`d-${id}`).innerHTML = detailHTML(t);
}

function detailHTML(t) {
  let h = '';
  if (t.description) h += `<div class="section"><div class="section-label">Description</div><div class="section-body">${esc(t.description)}</div></div>`;
  if (t.notes)       h += `<div class="section"><div class="section-label">Notes</div><div class="section-body notes">${esc(t.notes)}</div></div>`;
  const cc = t.comments || [];
  h += `<div class="section"><div class="section-label">Comments${cc.length ? ` (${cc.length})` : ''}</div>`;
  h += cc.length ? commentsHTML(cc) : '<div style="color:var(--faint);font-size:12px;margin-bottom:10px">No comments yet.</div>';
  h += replyFormHTML(t.id);
  h += '</div>';
  return h;
}

function replyFormHTML(taskId) {
  const humanUsers = users.filter(u => u.type === 'human');
  const options = humanUsers.map(u =>
    `<option value="${u.id}">${esc(u.name)}</option>`
  ).join('');
  return `
    <div class="reply-form" id="reply-${taskId}">
      <select class="reply-author">${options}</select>
      <textarea class="reply-textarea" placeholder="Write a comment…" rows="2"></textarea>
      <div class="reply-actions">
        <button class="reply-submit" onclick="submitReply('${taskId}')">Reply</button>
      </div>
    </div>`;
}

async function submitReply(taskId) {
  const form  = document.getElementById(`reply-${taskId}`);
  const body  = form.querySelector('.reply-textarea').value.trim();
  const authorId = form.querySelector('.reply-author').value;
  if (!body) return;

  const btn = form.querySelector('.reply-submit');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  await fetch(`/api/tasks/${taskId}/comments`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ author_id: authorId, body }),
  });

  // Reload the detail to show the new comment
  const task = await api(`/api/tasks/${taskId}`);
  document.getElementById(`d-${taskId}`).innerHTML = detailHTML(task);
  await loadSummary();
}

function commentsHTML(cc) {
  return '<div class="comments">' + cc.map(c => {
    const isAgent = c.author_type === 'agent';
    const init = c.author_name ? c.author_name[0].toUpperCase() : '?';
    return `<div class="comment">
      <div class="av28${isAgent ? ' agent' : ''}">${init}</div>
      <div class="comment-right">
        <div class="comment-head">
          <span class="comment-author">${esc(c.author_name || 'Unknown')}</span>
          <span class="comment-time">${ago(c.created_at)}</span>
        </div>
        <div class="comment-body">${esc(c.body)}</div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(task = null) {
  editingTaskId = task?.id || null;
  document.getElementById('modal-title').textContent = task ? 'Edit Task' : 'New Task';
  document.getElementById('f-title').value       = task?.title || '';
  document.getElementById('f-description').value = task?.description || '';
  document.getElementById('f-priority').value    = task?.priority || 'medium';
  document.getElementById('f-status').value      = task?.status || 'todo';
  document.getElementById('f-project').value     = task?.project_id || '';
  document.getElementById('f-notes').value       = task?.notes || '';
  document.getElementById('f-status-wrap').hidden = !task;

  // Set assignee checkboxes
  const checked = new Set((task?.assignees || []).map(a => a.id));
  document.querySelectorAll('#f-assignees input[type=checkbox]').forEach(cb => {
    cb.checked = checked.has(cb.value);
  });

  document.getElementById('modal-overlay').hidden = false;
  document.getElementById('f-title').focus();
}

function closeModal() {
  document.getElementById('modal-overlay').hidden = true;
  editingTaskId = null;
}

async function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }

  const assignees = [...document.querySelectorAll('#f-assignees input:checked')].map(cb => cb.value);
  const body = {
    title,
    description: document.getElementById('f-description').value.trim() || null,
    priority:    document.getElementById('f-priority').value,
    project_id:  document.getElementById('f-project').value || null,
    assignees,
    notes:       document.getElementById('f-notes').value.trim() || null,
  };

  const btn = document.getElementById('modal-save');
  btn.disabled = true;

  if (editingTaskId) {
    body.status = document.getElementById('f-status').value;
    await fetch(`/api/tasks/${editingTaskId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } else {
    await fetch('/api/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  }

  btn.disabled = false;
  closeModal();
  await Promise.all([loadTasks(), loadSummary()]);
}

async function editTask(id) {
  const task = await api(`/api/tasks/${id}`);
  openModal(task);
}

async function deleteTask(id) {
  const task = await api(`/api/tasks/${id}`);
  if (!confirm(`Delete "${task.title}"?\n\nThis will also delete all comments on this task.`)) return;
  await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
  if (openCardId === id) openCardId = null;
  await Promise.all([loadTasks(), loadSummary()]);
}

// ── Activity ──────────────────────────────────────────────────────────────────
async function loadActivity() {
  const items = await api('/api/activity');
  const el = document.getElementById('activity-feed');
  if (!items.length) { el.innerHTML = '<div class="empty">No activity yet.</div>'; return; }
  el.innerHTML = items.map(item => {
    const isAgent = item.author_type === 'agent';
    const init = item.author_name ? item.author_name[0].toUpperCase() : '?';
    return `<div class="activity">
      <div class="av28${isAgent ? ' agent' : ''}">${init}</div>
      <div class="activity-right">
        <div class="activity-head">
          <span class="act-author">${esc(item.author_name || 'Unknown')}</span>
          <span class="act-on">on</span>
          <span class="act-task">${esc(item.task_title)}</span>
          <span class="badge s-${item.task_status}" style="font-size:10px;padding:1px 6px">${STATUS_LABELS[item.task_status] || item.task_status}</span>
          <span class="act-time">${ago(item.created_at)}</span>
        </div>
        <div class="activity-body">${esc(item.body)}</div>
      </div>
    </div>`;
  }).join('');
}

// ── Refresh ───────────────────────────────────────────────────────────────────
async function refresh() {
  await loadSummary();
  if (tab === 'tasks') await loadTasks();
  else await loadActivity();
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ago(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d < 7)  return `${d}d ago`;
  return new Date(iso).toLocaleDateString();
}

init();
</script>
